x-web-common: &web-common
  build:
    context: ../..
    dockerfile: Dockerfile
  restart: unless-stopped
  network_mode: host
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  env_file:
    - ../../.env
  environment:
    - LETSVIBE_DB_PATH=/app/data/letsvibe.db
    - LETSVIBE_BACKUP_DIR=/backups
    - LETSVIBE_TEMPLATES_DIR=/app/web/templates
    - LETSVIBE_STATIC_DIR=/app/web/static
    - LETSVIBE_EXTERNAL_WORKER=1
    - LETSVIBE_WORKER_URL=http://127.0.0.1:8099
    - PYTHONPATH=/engine
  volumes:
    - ../../data:/app/data
    - /home/todd/letsvibe-backups:/backups
    - ../../letsvibe/web/templates:/app/web/templates:ro
    - ../../letsvibe/web/static:/app/web/static:ro
    - ${LETSVIBE_ENGINE_PATH:-../../../letsvibe-engine}:/engine:ro

services:
  letsvibe-worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: letsvibe-worker
    restart: unless-stopped
    network_mode: host
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../../.env
    environment:
      - LETSVIBE_DB_PATH=/app/data/letsvibe.db
      - LETSVIBE_BACKUP_DIR=/backups
      - LETSVIBE_WORKER_HOST=127.0.0.1
      - LETSVIBE_WORKER_PORT=8099
      - PYTHONPATH=/engine
    volumes:
      - ../../data:/app/data
      - /home/todd/letsvibe-backups:/backups
      - ${LETSVIBE_ENGINE_PATH:-../../../letsvibe-engine}:/engine:ro
    command: ["python", "-m", "letsvibe.web.worker_daemon"]

  letsvibe-blue:
    <<: *web-common
    container_name: letsvibe-blue
    command: ["uvicorn", "letsvibe.web.server:app", "--host", "127.0.0.1", "--port", "8011", "--proxy-headers", "--forwarded-allow-ips=*", "--no-access-log"]

  letsvibe-green:
    <<: *web-common
    container_name: letsvibe-green
    profiles: ["green"]
    command: ["uvicorn", "letsvibe.web.server:app", "--host", "127.0.0.1", "--port", "8012", "--proxy-headers", "--forwarded-allow-ips=*", "--no-access-log"]

  letsvibe-proxy:
    image: caddy:2-alpine
    container_name: letsvibe-proxy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
