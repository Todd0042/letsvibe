<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Messages &amp; Tag Triage | LetsVibe</title>
  <link rel="icon" href="/static/favicon.ico?v=2" sizes="any">
  <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/static/site.css">
  <style>
    * { box-sizing: border-box; }
    body.admin-msg-body {
      margin: 0;
      background: #070b14;
      color: #e2e8f0;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      padding: 10px 18px;
      background: #0f172a;
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      gap: 12px;
      flex-shrink: 0;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .topbar-title {
      font-size: 1rem;
      font-weight: 700;
      color: #f8fafc;
    }
    .unread-pill {
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fca5a5;
    }
    .topbar-links {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .nav-btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: #1e293b;
      color: #e2e8f0;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .nav-btn:hover { border-color: #38bdf8; color: #fff; }
    .split-root {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 0;
    }
    .pane-half {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-right: 1px solid rgba(148, 163, 184, 0.2);
    }
    .pane-half:last-child { border-right: none; }
    .pane-header {
      padding: 10px 14px;
      background: #0b1220;
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }
    .pane-header h2 {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.02em;
    }
    .sub-split {
      flex: 1;
      display: flex;
      min-height: 0;
    }
    .rail {
      width: 220px;
      flex-shrink: 0;
      border-right: 1px solid rgba(148, 163, 184, 0.15);
      background: #0a101d;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .rail.tag-rail { width: 185px; }
    .rail-controls {
      padding: 8px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .ctrl-input, .ctrl-select {
      width: 100%;
      padding: 6px 8px;
      border-radius: 7px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: #020617;
      color: #f8fafc;
      font-size: 0.8rem;
      outline: none;
    }
    .ctrl-input:focus, .ctrl-select:focus { border-color: #38bdf8; }
    .rail-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .user-item, .tag-item {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: #cbd5e1;
      text-align: left;
      cursor: pointer;
      width: 100%;
      font-family: inherit;
    }
    .user-item:hover, .tag-item:hover { background: rgba(30, 41, 59, 0.65); }
    .user-item.active, .tag-item.active {
      background: rgba(56, 189, 248, 0.14);
      border-color: rgba(56, 189, 248, 0.45);
      color: #fff;
    }
    .user-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 0.84rem;
      font-weight: 600;
    }
    .user-badge {
      padding: 1px 6px;
      border-radius: 999px;
      background: #ef4444;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .user-preview {
      margin-top: 3px;
      font-size: 0.74rem;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tag-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .tag-count {
      font-size: 0.72rem;
      color: #94a3b8;
      background: rgba(148, 163, 184, 0.14);
      padding: 1px 7px;
      border-radius: 999px;
    }
    .main-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: #070b14;
    }
    .feed {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .empty-note {
      margin: auto;
      color: #64748b;
      font-size: 0.86rem;
      text-align: center;
      max-width: 280px;
    }
    .chat-card {
      display: flex;
      flex-direction: column;
      max-width: 88%;
    }
    .chat-card.user { align-self: flex-start; }
    .chat-card.admin { align-self: flex-end; align-items: flex-end; }
    .chat-bubble {
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 0.86rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .chat-card.user .chat-bubble {
      background: #1e293b;
      border: 1px solid rgba(148, 163, 184, 0.22);
      color: #f1f5f9;
    }
    .chat-card.admin .chat-bubble {
      background: #0369a1;
      color: #f8fafc;
    }
    .msg-meta-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
      font-size: 0.72rem;
      color: #64748b;
    }
    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 7px;
      border-radius: 999px;
      background: rgba(168, 85, 247, 0.18);
      border: 1px solid rgba(168, 85, 247, 0.45);
      color: #e9d5ff;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .tag-pill button {
      border: none;
      background: transparent;
      color: #d8b4fe;
      cursor: pointer;
      padding: 0;
      font-size: 0.75rem;
      line-height: 1;
    }
    .add-tag-btn {
      padding: 1px 7px;
      border-radius: 999px;
      border: 1px dashed rgba(148, 163, 184, 0.4);
      background: transparent;
      color: #94a3b8;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .add-tag-btn:hover { border-color: #38bdf8; color: #38bdf8; }
    .tag-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
      padding: 6px 8px;
      border-radius: 8px;
      background: #0f172a;
      border: 1px solid rgba(56, 189, 248, 0.35);
      max-width: 320px;
    }
    .quick-chip {
      padding: 2px 7px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: #1e293b;
      color: #e2e8f0;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .quick-chip:hover { border-color: #a855f7; color: #f3e8ff; }
    .tag-custom-form {
      display: flex;
      gap: 4px;
      width: 100%;
      margin-top: 4px;
    }
    .reply-box {
      padding: 10px 12px;
      border-top: 1px solid rgba(148, 163, 184, 0.16);
      background: #0b1220;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    .reply-box textarea {
      flex: 1;
      resize: none;
      min-height: 40px;
      max-height: 110px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: #020617;
      color: #f8fafc;
      font-family: inherit;
      font-size: 0.86rem;
      outline: none;
    }
    .reply-box textarea:focus { border-color: #38bdf8; }
    .reply-box button {
      padding: 9px 14px;
      border-radius: 8px;
      border: none;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      font-size: 0.84rem;
      cursor: pointer;
    }
    .tag-msg-card {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: #0f172a;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .tag-msg-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.78rem;
      color: #94a3b8;
    }
    .jump-btn {
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.4);
      background: rgba(56, 189, 248, 0.1);
      color: #7dd3fc;
      font-size: 0.73rem;
      font-weight: 600;
      cursor: pointer;
    }
    .jump-btn:hover { background: rgba(56, 189, 248, 0.22); }
    @media (max-width: 960px) {
      body.admin-msg-body { height: auto; overflow: auto; }
      .split-root { grid-template-columns: 1fr; }
      .pane-half { min-height: 75vh; border-right: none; border-bottom: 2px solid rgba(148, 163, 184, 0.25); }
    }
  </style>
</head>
<body class="admin-msg-body">
  <header class="topbar">
    <div class="topbar-left">
      <a class="nav-btn" href="/admin" style="background: rgba(56, 189, 248, 0.14); border-color: rgba(56, 189, 248, 0.45); color: #7dd3fc;"><i class="fa-solid fa-arrow-left"></i> Back to Admin</a>
      <span class="topbar-title"><i class="fa-solid fa-comments" style="color:#38bdf8;"></i> Admin Messages</span>
      <span class="unread-pill" id="global-unread">0 unread</span>
    </div>
    <div class="topbar-links">
      <button type="button" class="nav-btn" id="btn-refresh-all"><i class="fa-solid fa-rotate"></i> Refresh</button>
      <a class="nav-btn" href="/"><i class="fa-solid fa-trophy"></i> Leaderboard</a>
    </div>
  </header>

  <main class="split-root">
    <!-- LEFT HALF: Chat by User -->
    <section class="pane-half" aria-label="Chats by User">
      <div class="pane-header">
        <h2><i class="fa-solid fa-user-group"></i> Conversations by User</h2>
        <span id="active-user-label" style="font-size:0.78rem;color:#94a3b8;">Select a user</span>
      </div>
      <div class="sub-split">
        <aside class="rail">
          <div class="rail-controls">
            <input type="text" id="user-search" class="ctrl-input" placeholder="Search username...">
            <select id="user-sort" class="ctrl-select">
              <option value="unread">Unread first</option>
              <option value="newest">Newest activity</option>
              <option value="oldest">Oldest activity</option>
            </select>
          </div>
          <div class="rail-list" id="user-list"></div>
        </aside>
        <div class="main-col">
          <div class="feed" id="chat-feed">
            <div class="empty-note">Pick a user on the left to view their messages, tag them, and reply.</div>
          </div>
          <form class="reply-box" id="reply-form" style="display:none;">
            <textarea id="reply-input" rows="2" maxlength="2000" placeholder="Reply directly to this user..."></textarea>
            <button type="submit" id="reply-send">Send</button>
          </form>
        </div>
      </div>
    </section>

    <!-- RIGHT HALF: Messages by Tag (Newest -> Oldest) -->
    <section class="pane-half" aria-label="Messages by Tag">
      <div class="pane-header">
        <h2><i class="fa-solid fa-tags"></i> Messages by Tag</h2>
        <select id="tag-sort" class="ctrl-select" style="width:auto;">
          <option value="newest">Newest &rarr; Oldest</option>
          <option value="oldest">Oldest &rarr; Newest</option>
        </select>
      </div>
      <div class="sub-split">
        <aside class="rail tag-rail">
          <div class="rail-controls">
            <input type="text" id="tag-filter" class="ctrl-input" placeholder="Filter tags...">
          </div>
          <div class="rail-list" id="tag-list"></div>
        </aside>
        <div class="main-col">
          <div class="feed" id="tag-feed">
            <div class="empty-note">Select a tag on the left to inspect all tagged messages across users.</div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const QUICK_TAGS = ['bug', 'rubric', 'esp32', 'feature', 'ui', 'follow-up', 'praise'];
    let activeThreadId = null;
    let activeTag = null;
    let openPickerMsgId = null;
    let allTags = [];

    function esc(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function fmtTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      return d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    }

    async function loadThreads() {
      const q = encodeURIComponent(document.getElementById('user-search').value.trim());
      const sort = encodeURIComponent(document.getElementById('user-sort').value);
      const res = await fetch(`/api/admin/chat/threads?q=${q}&sort=${sort}`, { credentials: 'same-origin' });
      if (!res.ok) return;
      const data = await res.json();
      const threads = data.threads || [];
      const totalUnread = threads.reduce((acc, t) => acc + Number(t.unread_admin || 0), 0);
      document.getElementById('global-unread').textContent = `${totalUnread} unread`;

      const listEl = document.getElementById('user-list');
      if (!threads.length) {
        listEl.innerHTML = `<div class="empty-note" style="padding:16px;">No conversations yet.</div>`;
        return;
      }
      listEl.innerHTML = threads.map(t => `
        <button type="button" class="user-item ${t.id === activeThreadId ? 'active' : ''}" data-thread-id="${t.id}">
          <div class="user-top">
            <span>@${esc(t.username)}</span>
            ${t.unread_admin > 0 ? `<span class="user-badge">${t.unread_admin}</span>` : ''}
          </div>
          <div class="user-preview">${t.last_sender_role === 'admin' ? 'You: ' : ''}${esc(t.last_body || '')}</div>
        </button>
      `).join('');
      listEl.querySelectorAll('.user-item').forEach(btn => {
        btn.addEventListener('click', () => openThread(Number(btn.dataset.threadId)));
      });
    }

    async function openThread(threadId) {
      activeThreadId = threadId;
      openPickerMsgId = null;
      const res = await fetch(`/api/admin/chat/threads/${threadId}?mark_read=true`, { credentials: 'same-origin' });
      if (!res.ok) return;
      const thread = await res.json();
      document.getElementById('active-user-label').textContent = `@${thread.username}`;
      document.getElementById('reply-form').style.display = 'flex';
      renderThreadMessages(thread.messages || []);
      await loadThreads();
    }

    function renderThreadMessages(msgs) {
      const feed = document.getElementById('chat-feed');
      if (!msgs.length) {
        feed.innerHTML = `<div class="empty-note">No messages in this thread yet.</div>`;
        return;
      }
      feed.innerHTML = msgs.map(m => {
        const role = m.sender_role === 'admin' ? 'admin' : 'user';
        const who = role === 'admin' ? 'Todd' : `@${m.sender_username}`;
        const tagPills = (m.tags || []).map(tag => `
          <span class="tag-pill">${esc(tag)} <button type="button" title="Remove tag" onclick="removeTag(${m.id}, '${esc(tag)}')">&times;</button></span>
        `).join('');
        const picker = openPickerMsgId === m.id ? `
          <div class="tag-picker">
            ${QUICK_TAGS.map(qt => `<button type="button" class="quick-chip" onclick="addTag(${m.id}, '${qt}')">+ ${qt}</button>`).join('')}
            <form class="tag-custom-form" onsubmit="submitCustomTag(event, ${m.id})">
              <input type="text" class="ctrl-input" id="custom-tag-${m.id}" placeholder="custom tag..." maxlength="32">
              <button type="submit" class="quick-chip">Add</button>
            </form>
          </div>
        ` : '';
        return `
          <div class="chat-card ${role}">
            <div class="chat-bubble">${esc(m.body)}</div>
            <div class="msg-meta-row">
              <span>${esc(who)} &middot; ${esc(fmtTime(m.created_at))}</span>
              ${tagPills}
              <button type="button" class="add-tag-btn" onclick="togglePicker(${m.id})">+ Tag</button>
            </div>
            ${picker}
          </div>
        `;
      }).join('');
      feed.scrollTop = feed.scrollHeight;
    }

    window.togglePicker = function (msgId) {
      openPickerMsgId = openPickerMsgId === msgId ? null : msgId;
      if (activeThreadId) openThread(activeThreadId);
    };

    window.addTag = async function (msgId, tag) {
      const res = await fetch(`/api/admin/chat/messages/${msgId}/tags`, {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tag }),
      });
      if (res.ok) {
        openPickerMsgId = null;
        if (activeThreadId) await openThread(activeThreadId);
        await loadTags();
        if (activeTag) await loadTagFeed(activeTag);
      }
    };

    window.submitCustomTag = function (e, msgId) {
      e.preventDefault();
      const input = document.getElementById(`custom-tag-${msgId}`);
      if (input && input.value.trim()) window.addTag(msgId, input.value.trim());
    };

    window.removeTag = async function (msgId, tag) {
      const res = await fetch(`/api/admin/chat/messages/${msgId}/tags/${encodeURIComponent(tag)}`, {
        method: 'DELETE',
        credentials: 'same-origin',
      });
      if (res.ok) {
        if (activeThreadId) await openThread(activeThreadId);
        await loadTags();
        if (activeTag) await loadTagFeed(activeTag);
      }
    };

    async function loadTags() {
      const res = await fetch('/api/admin/chat/tags', { credentials: 'same-origin' });
      if (!res.ok) return;
      const data = await res.json();
      allTags = data.tags || [];
      renderTagRail();
    }

    function renderTagRail() {
      const filter = document.getElementById('tag-filter').value.trim().toLowerCase();
      const filtered = allTags.filter(t => !filter || t.tag.includes(filter));
      const listEl = document.getElementById('tag-list');
      if (!filtered.length) {
        listEl.innerHTML = `<div class="empty-note" style="padding:16px;">No tags yet. Click "+ Tag" on any message.</div>`;
        return;
      }
      listEl.innerHTML = filtered.map(t => `
        <button type="button" class="tag-item ${t.tag === activeTag ? 'active' : ''}" data-tag="${esc(t.tag)}">
          <span>#${esc(t.tag)}</span>
          <span class="tag-count">${t.count}</span>
        </button>
      `).join('');
      listEl.querySelectorAll('.tag-item').forEach(btn => {
        btn.addEventListener('click', () => loadTagFeed(btn.dataset.tag));
      });
      if (!activeTag && filtered.length) {
        loadTagFeed(filtered[0].tag);
      }
    }

    async function loadTagFeed(tag) {
      activeTag = tag;
      renderTagRail();
      const sort = encodeURIComponent(document.getElementById('tag-sort').value);
      const res = await fetch(`/api/admin/chat/messages?tag=${encodeURIComponent(tag)}&sort=${sort}`, { credentials: 'same-origin' });
      if (!res.ok) return;
      const data = await res.json();
      const msgs = data.messages || [];
      const feed = document.getElementById('tag-feed');
      if (!msgs.length) {
        feed.innerHTML = `<div class="empty-note">No messages found with tag #${esc(tag)}.</div>`;
        return;
      }
      feed.innerHTML = msgs.map(m => `
        <div class="tag-msg-card">
          <div class="tag-msg-head">
            <span><strong>@${esc(m.thread_username)}</strong> (${m.sender_role === 'admin' ? 'Todd' : 'User'}) &middot; ${esc(fmtTime(m.created_at))}</span>
            <button type="button" class="jump-btn" onclick="openThreadFromTag(${m.thread_id})">Open in Chat &rarr;</button>
          </div>
          <div style="font-size:0.86rem;line-height:1.45;white-space:pre-wrap;color:#f1f5f9;">${esc(m.body)}</div>
          <div class="msg-meta-row">
            ${(m.tags || []).map(t => `<span class="tag-pill">${esc(t)} <button type="button" onclick="removeTag(${m.id}, '${esc(t)}')">&times;</button></span>`).join('')}
          </div>
        </div>
      `).join('');
    }

    window.openThreadFromTag = function (threadId) {
      openThread(threadId);
    };

    document.getElementById('reply-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!activeThreadId) return;
      const input = document.getElementById('reply-input');
      const text = input.value.trim();
      if (!text) return;
      const btn = document.getElementById('reply-send');
      btn.disabled = true;
      try {
        const res = await fetch(`/api/admin/chat/threads/${activeThreadId}/reply`, {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ body: text }),
        });
        if (res.ok) {
          input.value = '';
          await openThread(activeThreadId);
        }
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('reply-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('reply-form').requestSubmit();
      }
    });

    document.getElementById('user-search').addEventListener('input', loadThreads);
    document.getElementById('user-sort').addEventListener('change', loadThreads);
    document.getElementById('tag-filter').addEventListener('input', renderTagRail);
    document.getElementById('tag-sort').addEventListener('change', () => { if (activeTag) loadTagFeed(activeTag); });
    document.getElementById('btn-refresh-all').addEventListener('click', () => {
      loadThreads();
      loadTags();
      if (activeThreadId) openThread(activeThreadId);
      if (activeTag) loadTagFeed(activeTag);
    });

    loadThreads();
    loadTags();
    setInterval(loadThreads, 15000);
  </script>
