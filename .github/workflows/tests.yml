name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit, API & secrets guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .[dev]
      - name: Secrets guard
        run: python -m pytest -q tests/test_no_secrets.py
      - name: Unit and API tests
        run: python -m pytest -q --ignore=tests/ui

  browser:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .[dev]
      - run: python -m playwright install --with-deps chromium
      - name: Browser tests
        run: python -m pytest -q tests/ui
